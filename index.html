<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SGG - Sistema de Gestión de Gastos</title>
    <meta name="description" content="SGG - Sistema de Gestión de Gastos. Iniciá sesión para administrar tus ingresos, egresos y presupuesto personal.">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- Botón switch día/noche -->
    <button id="themeToggle" class="theme-toggle" aria-label="Alternar modo claro y oscuro">
        <span id="themeIcon">🌙</span>
    </button>

    <div class="auth-container" id="authCard" style="max-width:400px">
        
        <div id="authFormsBlock">
            <div class="auth-header">
                <h2 id="formTitle">Iniciar Sesión</h2>
                <p id="formSubtitle">Introduce tus credenciales para acceder</p>
            </div>

            <div id="alertBox" class="alert-message" role="alert" aria-live="polite"></div>

            <form id="authForm" class="auth-form" novalidate>
                <div class="form-group">
                    <label for="username">Nombre de Usuario</label>
                    <input type="text" id="username" required placeholder="Ej. admin" autocomplete="username">
                </div>

                <div class="form-group">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" required placeholder="••••••••" autocomplete="current-password">
                </div>

                <button type="submit" id="btnSubmit" class="btn-submit">Ingresar</button>
            </form>

            <div class="auth-toggle">
                <span id="toggleText">¿No tenés cuenta?</span> 
                <a href="#" id="toggleFormLink">Registrate acá</a>
            </div>

            <!-- Usuarios de prueba -->
            <div class="hint-box" aria-label="Usuarios de prueba disponibles">
                <p><strong>Usuarios de prueba:</strong></p>
                <p>👤 <code>admin</code> / <code>admin123</code></p>
                <p>👤 <code>santino</code> / <code>contrasena</code></p>
            </div>
        </div>

        <div id="welcomeBlock" class="welcome-screen" style="display:none">
        <div class="dashboard-inner">
            
            <div class="dashboard-top-bar">
                <div>Sesión activa: <strong id="displayUser"></strong></div>
                <button id="btnLogout" class="btn-logout">Cerrar Sesión</button>
            </div>

            <div class="dashboard-content-header">
                <h1>Panel de Gastos</h1>
                <p>Sistema de Gestión de Gastos — SGG</p>
            </div>

            <main>
                <section class="modules-grid" aria-label="Módulos de gestión">
                    <button class="module-btn" data-modulo="1">
                        💰
                        <span class="module-title">Ingresos</span>
                        <span>Registrar entradas</span>
                    </button>
                    <button class="module-btn" data-modulo="2">
                        📊
                        <span class="module-title">Gastos</span>
                        <span>Registrar egresos</span>
                    </button>
                    <button class="module-btn" data-modulo="3">
                        📈
                        <span class="module-title">Reportes</span>
                        <span>Ver estadísticas</span>
                    </button>
                    <button class="module-btn" data-modulo="4">
                        🗂️
                        <span class="module-title">Categorías</span>
                        <span>Organizar gastos</span>
                    </button>
                    <button class="module-btn" data-modulo="5">
                        🎯
                        <span class="module-title">Presupuesto</span>
                        <span>Definir límites</span>
                    </button>
                    <button class="module-btn" data-modulo="6">
                        ⚙️
                        <span class="module-title">Configuración</span>
                        <span>Ajustes del sistema</span>
                    </button>
                </section>

                <section class="status-container" aria-live="polite">
                    <div id="statusMessage" class="status-message"></div>
                </section>
            </main>

            <div class="divider"></div>

            <div class="change-password-wrapper">
                <h2 class="change-pwd-title">Configuración de Seguridad</h2>
                <div id="alertBoxDashboard" class="alert-message" role="alert" aria-live="polite"></div>
                
                <form id="changePasswordForm" class="auth-form" novalidate>
                    <div class="form-group">
                        <label for="currentPassword">Contraseña Actual</label>
                        <input type="password" id="currentPassword" required placeholder="••••••••" autocomplete="current-password">
                    </div>
                    <div class="form-group">
                        <label for="newPassword">Nueva Contraseña</label>
                        <input type="password" id="newPassword" required placeholder="••••••••" autocomplete="new-password">
                    </div>
                    <button type="submit" class="btn-submit">Actualizar Contraseña</button>
                </form>
            </div>

        </div><!-- /dashboard-inner -->
        </div><!-- /welcomeBlock -->

    </div><!-- /authCard -->

    <!-- JS separado - Principio de Modularidad -->
    <script src="js/login.js"></script>
</body>
</html>
